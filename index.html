<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>裝置借用系統</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div id="appSection">
        <header>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h1>裝置借用系統</h1>
                <button id="darkModeToggle" class="mode-button" aria-label="切換夜間模式">
                    <span class="mode-icon light-icon">☀️</span>
                    <span class="mode-icon dark-icon">🌙</span>
                </button>
            </div>
            <div class="header-buttons">
                <button id="scanButton" class="primary-button">掃描借用</button>
                <button id="returnButton" class="warning-button" onclick="toggleReturnScanner()">掃描歸還</button>
                <button id="historyButton" class="secondary-button" onclick="showHistory()">借閱歷史</button>
            </div>
        </header>

        <div class="category-container">
            <div class="category-buttons">
                <button class="category-button active" data-category="all">全部</button>
                <button class="category-button" data-category="phone">手機</button>
                <button class="category-button" data-category="camera">攝影</button>
                <button class="category-button" data-category="audio">音響</button>
                <button class="category-button" data-category="drone">空拍</button>
                <button class="category-button" data-category="misc">其他</button>
            </div>
        </div>

        <div id="returnScannerSection" style="display: none;">
            <div class="scanner-container">
                <h2>請掃描設備借閱ID進行歸還</h2>
                <input type="text" id="returnBarcodeInput" placeholder="設備借閱ID" autofocus>
            </div>
        </div>

        <div id="scannerSection" style="display: none;">
            <div class="scanner-container">
                <div id="deviceScanStep">
                    <h2>步驟1：請掃描裝置條碼</h2>
                    <input type="text" id="barcodeInput" placeholder="裝置條碼輸入區" autofocus>
                </div>
                <div id="studentScanStep" style="display: none;">
                    <h2>步驟2：請輸入學號</h2>
                    <input type="text" id="studentInput" placeholder="請輸入學號" autofocus>
                </div>
            </div>
        </div>

        <div class="table-container">
            <table id="deviceTable">
                <tr>
                    <th>裝置名稱</th>
                    <th>借出狀態</th>
                    <th>借閱人</th>
                    <th>時間</th>
                    <th>物品備註</th>
                </tr>
            </table>
        </div>
    </div>

    <div id="historySection" style="display: none;">
        <header>
            <h2>借閱歷史記錄</h2>
            <div class="header-buttons">
                <button class="secondary-button" onclick="showApp()">返回主頁</button>
            </div>
        </header>
        <div class="table-container">
            <table id="historyTable">
                <tr>
                    <th>設備名稱</th>
                    <th>借用者</th>
                    <th>借出時間</th>
                    <th>歸還時間</th>
                </tr>
            </table>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="app.js"></script>
</body>
</html>
