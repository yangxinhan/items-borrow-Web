<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>裝置借用系統</title>
    <link rel="stylesheet" href="app.css">
    
    <!-- Firebase SDK - 注意載入順序很重要 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-analytics.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
</head>
<body>
    <div id="appSection">
        <header>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h1>裝置借用系統</h1>
                <div class="header-right">
                    <!-- 新增登入按鈕 -->
                    <button id="loginButton" class="primary-button">
                        <img src="https://www.google.com/favicon.ico" alt="Google" style="width: 18px; height: 18px; margin-right: 8px; vertical-align: middle;">
                        Google 登入
                    </button>
                    <!-- 其他按鈕初始隱藏 -->
                    <button id="logoutButton" class="secondary-button" style="display: none;">登出</button>
                    <button id="darkModeToggle" class="mode-button" aria-label="切換夜間模式">
                        <span class="mode-icon light-icon">☀️</span>
                        <span class="mode-icon dark-icon">🌙</span>
                    </button>
                </div>
            </div>
            <div class="header-buttons">
                <!-- 修改這些按鈕的初始狀態為隱藏 -->
                <button id="scanButton" class="primary-button" style="display: none;">掃描借用</button>
                <button id="returnButton" class="warning-button" onclick="toggleReturnScanner()" style="display: none;">掃描歸還</button>
                <button id="historyButton" class="secondary-button" onclick="showHistory()" style="display: none;">借閱歷史</button>
            </div>
        </header>

        <div class="category-container">
            <div class="category-buttons">
                <button class="category-button active" data-category="all">全部</button>
                <button class="category-button" data-category="phone">手機</button>
                <button class="category-button" data-category="camera">攝影</button>
                <button class="category-button" data-category="audio">音響</button>
                <button class="category-button" data-category="drone">空拍</button>
                <button class="category-button" data-category="misc">其他</button>
            </div>
        </div>

        <div id="returnScannerSection" style="display: none;">
            <div class="scanner-container">
                <h2>請掃描設備借閱ID進行歸還</h2>
                <input type="text" id="returnBarcodeInput" placeholder="設備借閱ID" autofocus>
            </div>
        </div>

        <div id="scannerSection" style="display: none;">
            <div class="scanner-container">
                <div id="deviceScanStep">
                    <h2>步驟1：請掃描裝置條碼</h2>
                    <input type="text" id="barcodeInput" placeholder="裝置條碼輸入區" autofocus>
                </div>
                <!-- 移除 studentScanStep -->
            </div>
        </div>

        <div class="table-container">
            <table id="deviceTable">
                <tr>
                    <th>裝置名稱</th>
                    <th>借出狀態</th>
                    <th>借閱人</th>
                    <th>時間</th>
                    <th>物品備註</th>
                </tr>
            </table>
        </div>
    </div>

    <div id="historySection" style="display: none;">
        <header>
            <h2>借閱歷史記錄</h2>
            <div class="header-buttons">
                <button class="secondary-button" onclick="showApp()">返回主頁</button>
            </div>
        </header>
        <div class="table-container">
            <table id="historyTable">
                <tr>
                    <th>設備名稱</th>
                    <th>借用者</th>
                    <th>借出時間</th>
                    <th>歸還時間</th>
                </tr>
            </table>
        </div>
    </div>

    <div id="itemDetailModal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <div class="modal-header">
                <h2 id="modalItemName"></h2>
            </div>
            <div class="modal-body">
                <!-- 修正圖片容器結構 -->
                <div class="item-image">
                    <img id="modalItemImage" src="" alt="設備圖片">
                </div>
                <div class="item-details">
                    <p><strong>設備編號：</strong><span id="modalItemId"></span></p>
                    <p><strong>規格說明：</strong><span id="modalItemSpecs"></span></p>
                    <p><strong>使用說明：</strong><span id="modalItemInstructions"></span></p>
                    <p><strong>借用狀態：</strong><span id="modalItemStatus"></span></p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
